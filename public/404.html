<!doctype html>

    <style>
      :root {
        font-family: "DM Sans", "Noto Sans SC", sans-serif;
        color: #304448;
        background: #83bdb9;
        font-synthesis: none;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
      }
      body {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
      }
      a {
        color: inherit;
      }
      button {
        font: inherit;
        cursor: pointer;
      }
      button:focus-visible,
      a:focus-visible {
        outline: 3px solid #fcf4d9;
        outline-offset: 4px;
      }
      .skip-link {
        position: fixed;
        z-index: 60;
        top: -50px;
        left: 15px;
        padding: 10px 16px;
        background: #fff;
      }
      .skip-link:focus {
        top: 12px;
      }
      .grain,

        pointer-events: none;

        align-items: center;

        text-decoration: none;
      }
      .brand-mark {
        width: 35px;
        height: 35px;
        border: 2px solid #304448;
        border-radius: 50%;
        position: relative;
        display: block;
        transform: rotate(-22deg);
        flex: none;
      }
      .brand-mark span {
        position: absolute;
        background: #304448;
        border-radius: 2px;
      }
      .brand-mark span:first-child {
        width: 16px;
        height: 3px;
        top: 12px;
        left: 7px;
      }
      .brand-mark span:nth-child(2) {

        height: 8px;
        top: 16px;
        left: 9px;
      }
      .brand-mark span:nth-child(3) {
        width: 4px;
        height: 8px;
        top: 16px;
        right: 9px;
      }
      .brand-name {
        font-weight: 800;
        font-size: 20px;
        line-height: 1;
        display: flex;
        flex-direction: column;
      }
      .brand-dot {
        color: #ce765f;
        position: absolute;
        margin-left: 120px;
      }
      .brand-name small {
        font-family: "DM Mono", monospace;
        font-size: 9px;
        font-weight: 500;
        margin-top: 6px;
      }
      .language-switch {
        display: flex;
        gap: 4px;
      }
      .language-switch button {
        border: 1px solid rgba(48, 68, 72, 0.35);
        background: rgba(245, 244, 223, 0.14);
        color: #304448;
        border-radius: 4px;
        padding: 5px 10px;
        font-size: 11px;
        font-weight: 800;
      }
      .language-switch button[aria-pressed="true"] {
        background: #f6f0d9;
        border-color: #394e50;
      }
      main {
        flex: 1;
        display: grid;
        place-items: center;
        padding: 24px max(4.2%, env(safe-area-inset-right)) 40px
          max(4.2%, env(safe-area-inset-left));
      }
      .card {
        position: relative;
        z-index: 2;
        width: min(520px, 100%);
        background: #f3efda;
        border-left: 3px solid #405457;
        box-shadow: 10px 10px 0 rgba(50, 82, 82, 0.2);
        padding: 40px 38px 38px;
      }
      .label {
        font-family: "DM Mono", monospace;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #ce765f;
        margin: 0 0 14px;
      }
      .code {
        font-family: "DM Mono", monospace;
        font-size: clamp(84px, 20vw, 132px);
        font-weight: 500;
        line-height: 0.9;
        margin: 0;
        color: #405b59;
      }
      .desc {
        font-size: 14px;
        line-height: 1.8;
        margin: 18px 0 0;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 28px;
      }
      .btn {
        min-height: 46px;
        padding: 0 20px;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        border: 2px solid #394e50;
        border-radius: 4px;
        font-weight: 800;
        font-size: 12px;
        text-decoration: none;
      }
      .btn-primary {
        color: #f8f2db;
        background: #3c5656;
        box-shadow: 4px 4px 0 #f4e7ca;
      }
      .btn-primary:hover {
        transform: translate(-2px, -2px);
        box-shadow: 6px 6px 0 #f4e7ca;
      }
      .btn-ghost {
        background: transparent;
        color: #405b59;
        border-color: #94a8a0;
      }
      .btn svg {
        width: 16px;
        height: 16px;
      }
      @media (prefers-reduced-motion: reduce) {
        .btn-primary:hover {
          transform: none;
          box-shadow: 4px 4px 0 #f4e7ca;
        }
      }
      @media (max-width: 560px) {
        .site-header {
          height: 78px;
        }
        .card {
          padding: 30px 24px 28px;
          box-shadow: 6px 6px 0 rgba(50, 82, 82, 0.2);
        }
      }
